services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
        WWWUSER: ${WWWUSER:-1000}
    image: mothoq-app:dev
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
        WWWUSER: ${WWWUSER:-1000}
    image: mothoq-app:dev
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33061}:3306"

  redis:
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-63790}:6379"

volumes:
  node_modules_data:
  vendor_data:
