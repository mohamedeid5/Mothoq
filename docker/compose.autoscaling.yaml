name: mothoq

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE}
  env_file:
    - path: .env.production
      required: true
  environment:
    DB_URL: ""
    REDIS_HOST: tls://${REDIS_ENDPOINT:?Set REDIS_ENDPOINT}
    REDIS_URL: ""
    REDIS_PASSWORD: ""
    SESSION_DRIVER: redis
    SESSION_CONNECTION: default
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    CENTER_IMAGES_DISK: s3
    AWS_DEFAULT_REGION: ${AWS_REGION:?Set AWS_REGION}
    SESSION_SECURE_COOKIE: "true"
  restart: unless-stopped
  logging: &logging
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:?Set AWS_REGION}
      awslogs-group: ${LOG_GROUP_NAME:?Set LOG_GROUP_NAME}
      awslogs-create-group: "false"
      tag: "{{.Name}}/{{.ID}}"

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE}
    ports:
      - "80:80"
    volumes:
      - /opt/mothoq/nginx-origin.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  horizon:
    <<: *app
    command: php artisan horizon --no-interaction
    stop_grace_period: 120s

  scheduler:
    <<: *app
    command: php artisan schedule:work --no-interaction
    stop_grace_period: 120s
