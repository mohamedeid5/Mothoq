map $http_x_forwarded_proto $mothoq_forwarded_proto {
    default $scheme;
    https   https;
}

map $mothoq_forwarded_proto $mothoq_https {
    default off;
    https   on;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    include /etc/nginx/application.conf;
}
