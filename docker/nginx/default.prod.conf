map $http_cloudfront_forwarded_proto $mothoq_forwarded_proto {
    default $http_cloudfront_forwarded_proto;
    ""      $scheme;
}

map $mothoq_forwarded_proto $mothoq_https {
    default off;
    https   on;
}

include /etc/nginx/origin-tls/servers*.conf;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/application.conf;
}
