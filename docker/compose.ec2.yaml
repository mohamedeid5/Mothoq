name: mothoq

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE}
  env_file:
    - path: .env.production
      required: true
  volumes:
    - storage_data:/var/www/html/storage/app/public
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:?Set AWS_REGION}
      awslogs-group: /mothoq/production
      awslogs-create-group: "false"
      tag: "{{.Name}}/{{.ID}}"

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage/app/public:ro
      - /opt/mothoq/nginx-origin.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/mothoq/acme:/var/www/acme:ro
      - /opt/mothoq/tls:/etc/nginx/origin-tls:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  horizon:
    <<: *app
    command: php artisan horizon --no-interaction
    stop_grace_period: 120s

  scheduler:
    <<: *app
    command: php artisan schedule:work --no-interaction

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *logging

volumes:
  mysql_data:
  redis_data:
  storage_data:
