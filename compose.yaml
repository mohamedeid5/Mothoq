name: mothoq

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      WWWGROUP: ${WWWGROUP:-1000}
      WWWUSER: ${WWWUSER:-1000}
  image: mothoq-app:dev
  working_dir: /var/www/html
  environment:
    APP_NAME: Mothoq
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:${APP_PORT:-8080}
    LOG_CHANNEL: stack
    LOG_STACK: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: mothoq
    DB_USERNAME: mothoq
    DB_PASSWORD: secret
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - .:/var/www/html
    - vendor_data:/var/www/html/vendor
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    <<: *app
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mothoq
      MYSQL_USER: mothoq
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33061}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-63790}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
  node_modules_data:
  redis_data:
  vendor_data:
