x-production-app: &production-app
  image: ${APP_IMAGE:-mothoq-app:prod}
  working_dir: /var/www/html
  env_file:
    - path: .env.production
      required: true
  volumes:
    - storage_data:/var/www/html/storage/app/public
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *production-app
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s

  nginx:
    image: ${NGINX_IMAGE:-mothoq-nginx:prod}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - storage_data:/var/www/html/storage/app/public:ro
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s

  queue:
    <<: *production-app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600

  scheduler:
    <<: *production-app
    command: php artisan schedule:work --no-interaction

  mysql:
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    restart: unless-stopped
    healthcheck:
      interval: 10s
      start_period: 30s

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    restart: unless-stopped
    healthcheck:
      interval: 10s
      start_period: 10s

volumes:
  storage_data:
